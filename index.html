<style>
:root{--bg:#0a0614;--surface:#150b2b;--text:#f4eeff;--muted:#b3a6d6;--accent:#19f0e6;--on-accent:#06121a;--hot:#ff2d95;--line:#3a1f6b;--grid:rgba(130,80,230,.16);--glow:rgba(25,240,230,.38);--glow2:rgba(255,45,149,.34);
--head:'Chakra Petch','Arial Narrow',system-ui,sans-serif;--body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;

:root[data-theme="light"]{--bg:#fdeff8;--surface:#fff;--text:#1d0a3a;--muted:#6a4f8f;--accent:#087780;--on-accent:#fff;--hot:#e0157f;--line:#e2bfe0;--grid:rgba(150,80,170,.12);--glow:rgba(8,119,128,.22);--glow2:rgba(224,21,127,.2);color-scheme:light}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}

*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--text);font:400 1.05rem/1.6 var(--body);background:radial-gradient(60vw 40vh at 90% -5%,var(--glow2),transparent),radial-gradient(50vw 45vh at 0% 35%,var(--glow),transparent),linear-gradient(var(--grid) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/48px 48px,var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,rgba(0,0,0,.1) 0 1px,transparent 1px 3px)}
a{color:inherit}
:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--accent);box-shadow:0 0 18px var(--glow)}
header .wrap{display:flex;align-items:center;gap:18px;height:56px}
.logo{display:flex;align-items:center;gap:8px;font:700 italic 1.2rem var(--head);text-decoration:none;margin-right:auto}

#theme{border:1px solid var(--hot);background:transparent;color:var(--text);border-radius:0 10px 0 10px;padding:6px 12px;font:500 .85rem var(--body);cursor:pointer}
.hero{max-width:760px;padding:72px 0 64px}
h1{font:700 italic clamp(2.4rem,6vw,4.1rem)/1.02 var(--head);letter-spacing:-.01em;margin:0 0 20px;text-shadow:3px 0 var(--glow2),-3px 0 var(--glow)}
h2{font:700 italic clamp(1.7rem,3.5vw,2.4rem)/1.1 var(--head);margin:0 0 8px}

.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:12px 20px;border-radius:0 12px 0 12px;font-weight:700;text-decoration:none;border:2px solid var(--accent);color:var(--accent)}
.btn.main{background:var(--accent);color:var(--on-accent);box-shadow:0 0 20px var(--glow)}
.finish{height:14px;background:conic-gradient(var(--text) 25%,transparent 0 50%,var(--text) 0 75%,transparent 0) 0 0/14px 14px;opacity:.45}
section{padding:56px 0;border-top:2px dashed var(--line)}
.sub{color:var(--muted);margin:0 0 32px}
.proj{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:var(--surface);border:1px solid var(--accent);border-radius:0 22px 0 22px;box-shadow:0 0 22px var(--glow);overflow:hidden;display:flex;flex-direction:column}
.card.feat{grid-column:1/-1;flex-direction:row}
.card .art{min-height:120px;display:flex;align-items:flex-end;padding:14px 18px;font:700 italic 1.2rem var(--head);color:#14102e}
.feat .art{flex:0 0 36%;min-height:260px;font-size:1.8rem}
.card .body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.role{color:var(--muted);font-size:.92rem;margin:0}
.card ul{margin:0;padding-left:1.1em}.card li{margin-bottom:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tags span{font-size:.8rem;font-weight:500;padding:2px 10px;border-radius:0 8px 0 8px;color:var(--accent);border:1px solid var(--line)}
.links{display:flex;gap:16px;font-weight:700;font-size:.95rem}
.links a{color:var(--accent);text-underline-offset:4px}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px}
.skills h3{font-size:1.05rem;color:var(--hot)}.skills p{margin:0;color:var(--muted)}
.time{display:grid;gap:22px;max-width:720px}
.time div{display:grid;grid-template-columns:110px 1fr;gap:16px}
.time b{color:var(--accent)}.time p{margin:0;color:var(--muted)}
.contact .big{font:700 italic clamp(1.4rem,4vw,2.3rem) var(--head);word-break:break-all;color:var(--accent);text-shadow:0 0 18px var(--glow)}
.contact .links{margin-top:20px;flex-wrap:wrap}
footer{padding:28px 0;color:var(--muted);font-size:.9rem;border-top:2px dashed var(--line)}
#ebar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px);background:var(--surface);border:1px solid var(--hot);border-radius:0 14px 0 14px;padding:8px 10px;box-shadow:0 0 20px var(--glow2)}
#ebar[hidden]{display:none}
#ebar button{font:700 .9rem var(--body);padding:8px 14px;border-radius:0 10px 0 10px;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
#ebar button.pri{background:var(--accent);color:var(--on-accent)}
#ebar button:disabled{opacity:.5}
#ebar span{font-size:.85rem;color:var(--muted)}
.editing [data-p]:not(input):not(button){outline:1px dashed var(--hot);outline-offset:3px;cursor:text}
.mini{font:700 .75rem var(--body);padding:2px 8px;margin-left:6px;border:1px solid var(--hot);background:var(--bg);color:var(--hot);border-radius:0 6px 0 6px;cursor:pointer;white-space:nowrap}
.tools{display:flex;gap:6px}.body>.mini,section>.mini{align-self:flex-start;margin:8px 0 0}.editing .links{flex-wrap:wrap;align-items:center;gap:10px}.tools .mini{margin:0}
.lnk{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.url{font:400 .8rem var(--body);width:150px;padding:2px 6px;background:var(--bg);color:var(--text);border:1px solid var(--line)}
.art.img{color:#fff;text-shadow:0 1px 10px #000}.art .mini{margin-left:auto}
.time strong{color:var(--text)}
@media (max-width:820px){
.hero{padding-top:40px}
.proj{grid-template-columns:1fr}
.card.feat{flex-direction:column}.feat .art{min-height:140px}
nav{display:none}
.time div{grid-template-columns:1fr;gap:2px}}
</style>

<script>
(function(){
